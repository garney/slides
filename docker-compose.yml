# Production-style single container. Database and auth come from hosted Supabase (or `supabase start` on the host).
# Usage: cp .env.example .env  →  docker compose up --build

services:
  app:
    build: .
    ports:
      - "3091:3091"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3091
      APP_PUBLIC_URL: http://localhost:3091
